<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TapBat social card source</title>
  <style>
    @font-face { font-family: DM Sans; src: url('../public/assets/dm-sans-latin.woff2'); font-weight: 100 1000; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: DM Sans, Arial, sans-serif; color: #f4f2e8; background: #101c2a; }
    main { position: relative; width: 1200px; height: 630px; padding: 58px 72px; background: radial-gradient(ellipse at 87% 40%, #344849 0%, #182936 30%, #101c2a 63%); }
    .brand { display: flex; align-items: center; gap: 16px; font-size: 31px; font-weight: 650; letter-spacing: -1px; }
    .brand img { width: 49px; height: 49px; }
    h1 { margin: 44px 0 26px; font-size: 78px; line-height: 1.07; font-weight: 500; letter-spacing: -4px; }
    h1 em { font-family: Georgia, serif; font-weight: 400; color: #c2cdb0; }
    p { max-width: 600px; font-size: 23px; line-height: 1.5; color: #b5bfca; margin: 0; }
    .note { position: absolute; bottom: 57px; left: 72px; display: flex; align-items: center; gap: 18px; font-size: 13px; font-weight: 600; letter-spacing: 2.2px; color: #c2cdb0; }
    .note::before { content: ''; width: 35px; height: 1px; background: #c2cdb0; }
    figure { position: absolute; right: 94px; top: 29px; width: 236px; margin: 0; }
    .capture { width: 236px; height: 524.444px; display: block; border-radius: 15px; border: 1px solid #687b7c; box-shadow: 0 18px 55px #0007; }
    figcaption { margin-top: 19px; text-align: center; font-size: 11px; letter-spacing: 1.7px; color: #bdc7cc; }
  </style>
</head>
<body><main>
  <div class="brand"><img src="../public/assets/favicon.svg" alt="">TapBat</div>
  <h1>Tap to flap.<br><em>Hold to glide.</em></h1>
  <p>Fly through gaps between stone columns.<br>Try to beat your best score.</p>
  <div class="note">ANDROID / IN DEVELOPMENT</div>
  <figure><img class="capture" src="../public/assets/tapbat-gameplay.png" alt="Actual TapBat gameplay with vine-covered columns and sloping terrain."><figcaption>DEVELOPMENT BUILD</figcaption></figure>
</main></body>
</html>
